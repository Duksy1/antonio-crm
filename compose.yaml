name: apex-flow-crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: apex_flow_crm
      POSTGRES_USER: apex_flow_crm
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - apex_flow_crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_flow_crm -d apex_flow_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apex_flow_crm_postgres:
